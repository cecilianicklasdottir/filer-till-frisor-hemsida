
<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boka tid | STUDIO.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo">STUDIO<span>.</span></a>

        <nav class="navigation">
            <a href="index.html">Hem</a>
            <a href="index.html#services">Tjänster</a>
            <a href="index.html#about">Om oss</a>
        </nav>

        <a href="index.html#contact" class="header-button">
            Kontakt
        </a>
    </header>

    <main class="booking-page">

        <section class="booking-heading">
            <p class="eyebrow">BOKA DIN UPPLEVELSE</p>
            <h1>Din nästa stil börjar här.</h1>
            <p>Välj din behandling och skicka en bokningsförfrågan.</p>
        </section>

        <form id="booking-form" class="booking-form">

            <div class="form-group">
                <label for="service">Välj behandling</label>

                <select id="service" name="service" required>
                    <option value="">Välj en behandling</option>
                    <option value="Haircut">Klippning – 349 kr</option>
                    <option value="Beard Trim">Skäggtrimning – 199 kr</option>
                    <option value="Full Experience">Fullständig upplevelse – 499 kr</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Önskat datum</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="time">Önskad tid</label>

                <select id="time" name="time" required>
                    <option value="">Välj en tid</option>
                    <option value="09:00">09:00</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="13:00">13:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                    <option value="16:00">16:00</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name">Fullständigt namn</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Ditt namn"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">E-postadress</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="namn@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Telefonnummer</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Ditt telefonnummer"
                    autocomplete="tel"
                    required
                >
            </div>

            <button type="submit" class="primary-button booking-submit">
                Skicka bokningsförfrågan ↗
            </button>

            <p id="booking-message" role="status" aria-live="polite"></p>

            <p class="booking-note">
                Detta är en demonstrationsbokning.
                Ingen riktig tid reserveras.
            </p>

        </form>

    </main>

    <footer>
        <a href="index.html" class="logo">STUDIO<span>.</span></a>
        <p>© 2026 STUDIO. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
